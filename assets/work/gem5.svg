<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">gem5 build-system migration</title><desc id="desc">Conceptual summary, not a figure reproduced from a publication. A Humanize loop, with a Claude Code builder and a Codex reviewer, migrates gem5 from SCons to CMake and Ninja with a Bazel overlay; the new builds are checked with the full build, unit tests, and matching simulation objects.</desc>
